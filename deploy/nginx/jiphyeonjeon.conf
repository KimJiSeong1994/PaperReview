# ─────────────────────────────────────────────────────────────────────────────
# Jiphyeonjeon (PaperReviewAgent) Nginx reference config.
#
# REFERENCE ONLY — this file is committed for reproducibility and is NOT
# auto-applied. Apply it manually (or via CI) on the EC2 host, e.g.:
#   sudo cp deploy/nginx/jiphyeonjeon.conf /etc/nginx/sites-available/jiphyeonjeon
#   sudo ln -sf /etc/nginx/sites-available/jiphyeonjeon /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Goal: serve the CSR React SPA from web-ui/dist, but route the server-side
# SEO/GEO endpoints (/blog, /blog/{slug}, /sitemap.xml, /feed.xml) and /api to
# uvicorn on 127.0.0.1:8000 so non-JS crawlers and AI engines get rendered HTML.
#
# IMPORTANT: the specific SEO locations MUST appear BEFORE the generic
# `location /` block so they take precedence over the SPA fallback.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect the www host to the canonical apex domain.
server {
    listen 80;
    listen [::]:80;
    server_name www.jiphyeonjeon.kr;
    return 301 https://jiphyeonjeon.kr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jiphyeonjeon.kr;

    # Adjust to the deployed checkout path on EC2.
    root /home/ec2-user/PaperReviewAgent/web-ui/dist;
    index index.html;

    # ── Server-side rendered SEO/GEO endpoints (proxied to uvicorn) ──────────
    # These must come before `location /` so the SPA fallback does not shadow
    # them. Exact matches for the index/feed/sitemap; regex for /blog/{slug}.

    location = /blog {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Category hubs (/blog/category/{cat}) — two segments, so this must be a
    # distinct block from the single-segment /blog/{slug} regex below.
    location ~ ^/blog/category/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/blog/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API (proxied to uvicorn) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback (static assets + client-side routing) ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
