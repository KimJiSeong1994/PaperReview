# ─────────────────────────────────────────────────────────────────────────────
# Jiphyeonjeon (PaperReviewAgent) Nginx config — reference / documentation.
#
# Mirrors the ACTUAL production setup: HTTP (80) + HTTPS (443). It serves the
# CSR React SPA from web-ui/dist and proxies the server-side SEO/GEO endpoints
# (/blog, /blog/category/{cat}, /blog/series/{series}, /blog/{slug},
# /sitemap.xml, /feed.xml, /llms.txt, /llms-full.txt) and /api to uvicorn on
# 127.0.0.1:8000 so crawlers / AI engines get rendered HTML.
#
# TLS is managed by Certbot. The `listen 443 ssl` + `ssl_*` lines below are what
# `certbot --nginx` maintains — don't hand-edit them; regenerate on the host with:
#   sudo certbot --nginx -d jiphyeonjeon.kr -d www.jiphyeonjeon.kr
#
# ⚠️  REFERENCE ONLY — NOT auto-applied by CI. A deploy step that copied this file
#     over the live config once removed the TLS blocks (HTTPS outage) and carried a
#     wrong hardcoded `root` (homepage 500); that step was reverted (see PR #21).
#     To apply manually on the host:
#       sudo cp deploy/nginx/jiphyeonjeon.conf /etc/nginx/sites-available/paperreview
#       # set `root` below to the real deploy path FIRST, then let certbot add TLS:
#       sudo certbot --nginx -d jiphyeonjeon.kr -d www.jiphyeonjeon.kr
#       sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT:
#   • `root` MUST point at the built SPA on the host:
#       <deploy-home>/PaperReviewAgent/web-ui/dist
#     The placeholder below is intentionally not a real path so it can't be applied
#     blindly — a wrong hardcoded value made try_files loop on a missing index.html
#     and return HTTP 500 on '/'.
#   • The SEO `location` blocks MUST stay before the generic `location /` fallback.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect the www host to the canonical apex domain (HTTP and HTTPS).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;                                                            # managed by Certbot
    listen [::]:443 ssl;                                                       # managed by Certbot
    server_name www.jiphyeonjeon.kr;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.kr/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.kr/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot

    return 301 https://jiphyeonjeon.kr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;                                                            # managed by Certbot
    listen [::]:443 ssl;                                                       # managed by Certbot
    server_name jiphyeonjeon.kr;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.kr/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.kr/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot

    # Built SPA output — SET THIS to the real deploy checkout on the host, e.g.
    #   /home/<deploy-user>/PaperReviewAgent/web-ui/dist
    # (Placeholder is intentionally invalid; see the header note about the 500.)
    root /home/<deploy-user>/PaperReviewAgent/web-ui/dist;
    index index.html;

    # ── Server-side rendered SEO/GEO endpoints (proxied to uvicorn) ──────────
    # These must come before `location /` so the SPA fallback does not shadow
    # them. Exact matches for the index/feed/sitemap; regex for /blog/{slug}.

    location = /blog {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Category hubs (/blog/category/{cat}) — two segments, so this must be a
    # distinct block from the single-segment /blog/{slug} regex below.
    location ~ ^/blog/category/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Series hubs (/blog/series/{series}) — SSR pillar pages (e.g. the GNN
    # paper-review reading-order hub).
    location ~ ^/blog/series/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/blog/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Advertised in llms.txt and sitemap.xml — without this block it falls
    # through to the SPA fallback and serves index.html as text/html.
    location = /llms-full.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feed autodiscovery aliases and the slash variant of /blog previously
    # 200-served the SPA shell (soft-404 / wrong canonical for crawlers).
    location = /blog/    { return 301 /blog; }
    # Same class of bug for post/hub URLs: `location ~ ^/blog/[^/]+$` is
    # anchored, so a trailing slash fell through to the SPA fallback and
    # 200-served the shell (no post content, canonical pointing at `/`).
    location ~ ^/blog/(.+)/$ { return 301 /blog/$1; }
    location = /rss.xml  { return 301 /feed.xml; }
    location = /atom.xml { return 301 /feed.xml; }
    location = /feed     { return 301 /feed.xml; }

    # ── API (proxied to uvicorn) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static-asset performance ─────────────────────────────────────────────
    # Vite content-hashes everything under /assets/, so a year of immutable
    # caching is safe; index.html stays no-cache so deploys are picked up.
    # gzip covers nginx-served static files (the backend already compresses
    # its own responses via middleware).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json
               image/svg+xml text/plain application/xml application/rss+xml;

    # HSTS is scoped to nginx-served static locations only — proxied responses
    # already carry it from the backend middleware (avoids duplicate headers).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── SPA fallback (static assets + client-side routing) ───────────────────
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
