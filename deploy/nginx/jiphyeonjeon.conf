# ─────────────────────────────────────────────────────────────────────────────
# Jiphyeonjeon (PaperReviewAgent) Nginx config — reference / documentation.
#
# Mirrors the ACTUAL production setup: HTTP (80) + HTTPS (443). It serves the
# CSR React SPA from web-ui/dist and proxies the server-side SEO/GEO endpoints
# (/blog, /blog/category/{cat}, /blog/{slug}, /sitemap.xml, /feed.xml, /llms.txt)
# and /api to uvicorn on 127.0.0.1:8000 so crawlers / AI engines get rendered HTML.
#
# TLS is managed by Certbot. The `listen 443 ssl` + `ssl_*` lines below are what
# `certbot --nginx` maintains — don't hand-edit them; regenerate on the host with:
#   sudo certbot --nginx -d jiphyeonjeon.kr -d www.jiphyeonjeon.kr
#
# ⚠️  REFERENCE ONLY — NOT auto-applied by CI. A deploy step that copied this file
#     over the live config once removed the TLS blocks (HTTPS outage) and carried a
#     wrong hardcoded `root` (homepage 500); that step was reverted (see PR #21).
#     To apply manually on the host:
#       sudo cp deploy/nginx/jiphyeonjeon.conf /etc/nginx/sites-available/paperreview
#       # set `root` below to the real deploy path FIRST, then let certbot add TLS:
#       sudo certbot --nginx -d jiphyeonjeon.kr -d www.jiphyeonjeon.kr
#       sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT:
#   • `root` MUST point at the built SPA on the host:
#       <deploy-home>/PaperReviewAgent/web-ui/dist
#     The placeholder below is intentionally not a real path so it can't be applied
#     blindly — a wrong hardcoded value made try_files loop on a missing index.html
#     and return HTTP 500 on '/'.
#   • The SEO `location` blocks MUST stay before the generic `location /` fallback.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect the www host to the canonical apex domain (HTTP and HTTPS).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;                                                            # managed by Certbot
    listen [::]:443 ssl;                                                       # managed by Certbot
    server_name www.jiphyeonjeon.kr;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.kr/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.kr/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot

    return 301 https://jiphyeonjeon.kr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;                                                            # managed by Certbot
    listen [::]:443 ssl;                                                       # managed by Certbot
    server_name jiphyeonjeon.kr;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.kr/fullchain.pem;   # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.kr/privkey.pem;     # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;               # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                     # managed by Certbot

    # Built SPA output — SET THIS to the real deploy checkout on the host, e.g.
    #   /home/<deploy-user>/PaperReviewAgent/web-ui/dist
    # (Placeholder is intentionally invalid; see the header note about the 500.)
    root /home/<deploy-user>/PaperReviewAgent/web-ui/dist;
    index index.html;

    # ── Server-side rendered SEO/GEO endpoints (proxied to uvicorn) ──────────
    # These must come before `location /` so the SPA fallback does not shadow
    # them. Exact matches for the index/feed/sitemap; regex for /blog/{slug}.

    location = /blog {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Category hubs (/blog/category/{cat}) — two segments, so this must be a
    # distinct block from the single-segment /blog/{slug} regex below.
    location ~ ^/blog/category/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/blog/[^/]+$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API (proxied to uvicorn) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA fallback (static assets + client-side routing) ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
