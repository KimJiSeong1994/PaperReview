<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Poster - Editorial Evidence Wall Pipeline</title>
<style>
:root {
  --primary: #1d4ed8;
  --secondary: #334155;
  --accent: #b45309;
  --bg: #f8fafc;
  --box-bg: #ffffff;
  --border: #cbd5e1;
  --text: #1e293b;
  --text-light: #475569;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background: #cbd5e1;
  padding: 20px;
  overflow-x: auto;
}
.poster {
  width: 100%;
  max-width: 1600px;
  min-height: min(1200px, calc(100vw * 0.75));
  margin: 0 auto;
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
  padding: 36px;
  aspect-ratio: 4 / 3;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: min-content;
  gap: 20px;
}
.thesis {
  grid-column: 1 / 13;
  border-bottom: 4px solid var(--primary);
  padding-bottom: 16px;
}
.thesis h1 {
  font-size: clamp(2rem, 3vw, 3.25rem);
  line-height: 1.12;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: none;
  overflow-wrap: anywhere;
}
.thesis p {
  margin-top: 8px;
  max-width: 96ch;
  color: var(--secondary);
  font-size: 1.18rem;
  line-height: 1.45;
}
.panel {
  background: var(--box-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
}
.panel h2 {
  color: var(--primary);
  font-size: 1.12rem;
  font-weight: 750;
  line-height: 1.2;
  letter-spacing: 0;
  text-transform: none;
  margin-bottom: 12px;
}
.panel p,
.panel li,
.panel dd,
.panel dt,
figcaption {
  font-size: 0.94rem;
  line-height: 1.55;
}
.evidence { grid-column: 1 / 8; }
.metrics { grid-column: 8 / 13; }
.limitations { grid-column: 1 / 7; }
.provenance { grid-column: 7 / 10; }
.references { grid-column: 10 / 13; }
.evidence-list,
.reference-list {
  padding-left: 1.2rem;
}
.evidence-list li,
.reference-list li {
  min-height: 1.6em;
  margin-bottom: 8px;
}
.metric-list {
  display: grid;
  gap: 10px;
}
.metric-row {
  display: grid;
  grid-template-columns: minmax(7rem, 0.9fr) 1.1fr;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}
.metric-row dt {
  color: var(--text-light);
}
.metric-row dd {
  color: var(--text);
  font-weight: 700;
}
.evidence-figure {
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
}
.figure-slot {
  min-height: 190px;
  display: grid;
  place-items: center;
  color: var(--text-light);
  background: #f1f5f9;
  border-radius: 6px;
}
figcaption {
  color: var(--text-light);
  margin-top: 10px;
}
.provenance {
  background: #fff7ed;
  border-color: #fed7aa;
}
@page { size: A3 landscape; margin: 0; }
@media print {
  html, body { width: 420mm; height: 297mm; overflow: hidden; }
  body { background: #fff; padding: 0; display: flex; justify-content: center; }
  .poster {
    width: 396mm;
    height: 297mm;
    max-width: none;
    min-height: 297mm;
    box-shadow: none;
    overflow: hidden;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
@media (max-width: 1199px) {
  .poster { padding: 28px; gap: 16px; }
  .evidence { grid-column: 1 / 9; }
  .metrics { grid-column: 9 / 13; }
  .limitations { grid-column: 1 / 7; }
  .provenance { grid-column: 7 / 13; }
  .references { grid-column: 1 / 13; }
}
@media (max-width: 760px) {
  body { padding: 12px; overflow-x: hidden; }
  .poster { aspect-ratio: auto; min-height: auto; display: block; padding: 22px; }
  .panel, .thesis { margin-bottom: 16px; }
}
</style>
</head>
<body>
<main class="poster" aria-label="Academic poster reference">
  <header class="thesis">
    <h1 data-content=""></h1>
    <p data-content=""><!-- Review thesis populated from verified paper/review content. --></p>

  <section class="panel evidence" aria-labelledby="pipeline-evidence-title">

      <div class="figure-slot" data-content=""><!-- Source-derived pipeline, architecture, table, or extracted figure. --></div>

    <dl class="metric-list" data-content="">
      <div class="metric-row" data-content="">

</html>
