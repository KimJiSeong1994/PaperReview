# Reference Poster Metadata
# Maps visualization types and domains to reference poster files

reference_posters:
  multi_crit_reference:
    file: "multi_crit_reference.html"
    description: "12-column Editorial Evidence Wall emphasizing sourced metrics"
    layout_type: "editorial_evidence_wall"
    primary_visualization: "metric_definition_list"
    domains:
      - general
      - nlp_agent
      - theory
    best_for:
      - "source-backed performance or evaluation metrics"
      - "claim-to-evidence traceability"
      - "limitations and provenance visibility"

  pipeline_reference:
    file: "pipeline_reference.html"
    description: "12-column Editorial Evidence Wall emphasizing sourced figures or pipeline evidence"
    layout_type: "editorial_evidence_wall"
    primary_visualization: "semantic_figure"
    domains:
      - nlp_agent
      - cv
      - general
    best_for:
      - "source-derived architecture or pipeline evidence"
      - "figure/table support with figcaption"
      - "thesis-to-provenance poster flow"

# Selection rules
selection_rules:
  # If content has source-derived pipeline/architecture evidence → pipeline_reference
  has_pipeline: "pipeline_reference"
  # If content has source-backed performance metrics → multi_crit_reference
  has_performance_metrics: "multi_crit_reference"
  # Default fallback
  default: "multi_crit_reference"
