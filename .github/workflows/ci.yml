name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Backstop: the suite runs in ~1 min. If a test ever stalls on an external
    # call despite the conftest socket timeout, fail fast instead of hanging
    # the whole pipeline (and its deploy) for the GitHub 6-hour default.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r requirements.txt

      # The poster PDF tests skip themselves when no browser is installed, so
      # without this every claim the feature rests on — scripting disabled in
      # the render context, no egress, A3 geometry — passes CI by not running.
      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      # ubuntu-latest is 24.04, which blocks Chromium's unprivileged-user-
      # namespace sandbox via AppArmor. Arming the SUID helper rather than
      # relaxing that sysctl keeps CI on the *same* sandbox mechanism the
      # container uses, so a green run is evidence the production setup works
      # instead of only that some sandbox worked here.
      - name: Arm the Chromium SUID sandbox
        run: |
          helper="$(find "$HOME/.cache/ms-playwright" -type f -name chrome_sandbox | head -n1)"
          test -n "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          echo "CHROME_DEVEL_SANDBOX=$helper" >> "$GITHUB_ENV"

      - name: Lint with ruff
        run: ruff check .

      - name: Verify GEO generated projections and pilot records
        run: |
          python scripts/sync_geo_comparisons.py --check
          python scripts/validate_geo_pilot.py data/blog/geo-pilot.json data/blog/geo-pilot-observation.json

      - name: Run tests
        # Placeholders deliberately do NOT match real key formats to avoid
        # triggering GitHub/GitGuardian/TruffleHog secret scanners.
        env:
          OPENAI_API_KEY: ${{ secrets.CI_OPENAI_KEY || 'ci-placeholder-not-a-real-key' }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-placeholder-jwt-not-real' }}
          APP_PASSWORD: ${{ secrets.CI_APP_PASSWORD || 'ci-placeholder-password' }}
        run: pytest tests/ -v --tb=short --cov=routers --cov=app --cov=src --cov-report=term-missing --cov-fail-under=15

  skillopt-v020-exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Verify exact SkillOpt v0.2.0 Git objects
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/SkillOpt.git .skillopt-v020-repository
          test "$(git -C .skillopt-v020-repository rev-parse refs/tags/v0.2.0)" = "51d0a4d96e88558c84dee637f98e24e3fb2d1547"
          test "$(git -C .skillopt-v020-repository rev-parse refs/tags/v0.2.0^{commit})" = "e4ea6a6771e797ef820cdd8bfea64c57e0481065"
          test "$(git -C .skillopt-v020-repository rev-parse refs/tags/v0.2.0^{tree})" = "5a603e937a20f1078059f94039a50028c022487a"

      - name: Export tracked commit bytes without Git metadata
        run: |
          mkdir .skillopt-v020-source
          git -C .skillopt-v020-repository archive e4ea6a6771e797ef820cdd8bfea64c57e0481065 | tar -x -C .skillopt-v020-source
          test ! -e .skillopt-v020-source/.git

      - name: Install exact SkillOpt v0.2.0 dependencies
        run: pip install -r .skillopt-v020-source/requirements.txt

      - name: Run exact-source compatibility diagnostic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          SKILLOPT_V020_EXACT_SOURCE_REQUIRED: "1"
          SKILLOPT_V020_UPSTREAM_ROOT: ${{ github.workspace }}/.skillopt-v020-source
        run: pytest -q tests/integration/skillopt_upstream

  frontend-build:
    runs-on: ubuntu-latest
    env:
      VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED || secrets.VITE_ANALYTICS_ENABLED || 'true' }}
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || vars.VITE_GA_MEASUREMENT_ID || 'G-DSJQK7QE91' }}
      VITE_GA_DEBUG: ${{ vars.VITE_GA_DEBUG || 'false' }}
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 100 || echo "Lint warnings found (non-blocking)"

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-ui/dist
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, skillopt-v020-exact-source, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      RELEASE_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Skip a stale queued deployment
        id: stale
        run: |
          SKIP=$(ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -euo pipefail
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          APP_ROOT="$HOME/PaperReviewAgent"
          CURRENT_SHA=$(git -C "$APP_ROOT" rev-parse HEAD)
          git -C "$APP_ROOT" fetch origin "$DEPLOY_SHA" --quiet
          if test "$CURRENT_SHA" != "$DEPLOY_SHA" && \
             git -C "$APP_ROOT" merge-base --is-ancestor "$DEPLOY_SHA" "$CURRENT_SHA"; then
            echo true
          else
            echo false
          fi
          SCRIPT
          )
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle and deployment helpers
        if: steps.stale.outputs.skip != 'true'
        run: |
          tar -C frontend-dist -czf /tmp/frontend-dist.tar.gz .
          REMOTE_RELEASE="/tmp/paperreview-deploy-$RELEASE_ID"
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -m 700 '$REMOTE_RELEASE'"
          scp -i ~/.ssh/deploy_key \
            /tmp/frontend-dist.tar.gz \
            scripts/frontend_release.py \
            scripts/check_deploy_ready.py \
            scripts/deployment_state.py \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:"$REMOTE_RELEASE/"

      - name: Preflight release and save rollback state
        if: steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -euo pipefail
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          APP_ROOT="$HOME/PaperReviewAgent"
          REMOTE_RELEASE="/tmp/paperreview-deploy-$RELEASE_ID"
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/deployment_state.py" ensure-clear \
            --state-root "$APP_ROOT/.deploy-state"
          test -x "$APP_ROOT/venv/bin/python"
          test -f "$APP_ROOT/data/blog/posts.json"
          sudo -n systemctl is-active --quiet paperreview
          SERVICE_PID=$(sudo systemctl show paperreview -p MainPID --value)
          test "$SERVICE_PID" -gt 0
          test -r "/proc/$SERVICE_PID/cmdline"
          PREVIOUS_SHA=$(git -C "$APP_ROOT" rev-parse HEAD)
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/check_deploy_ready.py" \
            --posts "$APP_ROOT/data/blog/posts.json" --attempts 1 --service-pid "$SERVICE_PID" \
            --expected-revision "$PREVIOUS_SHA" --expected-pid "$SERVICE_PID" \
            --allow-legacy-attestation \
            --record-health-metadata "$REMOTE_RELEASE/backend.previous.health.json"
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/frontend_release.py" preflight \
            --archive "$REMOTE_RELEASE/frontend-dist.tar.gz" \
            --active "$APP_ROOT/web-ui/dist" \
            --release-id "$RELEASE_ID"
          printf '%s\n' "$PREVIOUS_SHA" > "$REMOTE_RELEASE/backend.previous.sha"
          SCRIPT

      - name: Persist durable deployment recovery state
        if: steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -euo pipefail
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          APP_ROOT="$HOME/PaperReviewAgent"
          REMOTE_RELEASE="/tmp/paperreview-deploy-$RELEASE_ID"
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/deployment_state.py" begin \
            --state-root "$APP_ROOT/.deploy-state" \
            --release-id "$RELEASE_ID" \
            --target-sha "$DEPLOY_SHA" \
            --previous-sha-file "$REMOTE_RELEASE/backend.previous.sha" \
            --previous-health-file "$REMOTE_RELEASE/backend.previous.health.json" \
            --frontend-active "$APP_ROOT/web-ui/dist" \
            --helper "frontend_release.py=$REMOTE_RELEASE/frontend_release.py" \
            --helper "check_deploy_ready.py=$REMOTE_RELEASE/check_deploy_ready.py" \
            --helper "deployment_state.py=$REMOTE_RELEASE/deployment_state.py"
          SCRIPT

      - name: Install exact backend revision and dependencies
        if: steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -euo pipefail
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          APP_ROOT="$HOME/PaperReviewAgent"
          STATE_RELEASE="$APP_ROOT/.deploy-state/releases/$RELEASE_ID"
          test -d "/tmp/paperreview-deploy-$RELEASE_ID"
          "$APP_ROOT/venv/bin/python" "$STATE_RELEASE/deployment_state.py" owns \
            --state-root "$APP_ROOT/.deploy-state" --release-id "$RELEASE_ID"
          cd "$APP_ROOT"
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach --force "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          source venv/bin/activate
          pip install -r requirements.txt --quiet
          SCRIPT

      - name: Atomically promote frontend
        if: steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -euo pipefail
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          APP_ROOT="$HOME/PaperReviewAgent"
          REMOTE_RELEASE="/tmp/paperreview-deploy-$RELEASE_ID"
          STATE_RELEASE="$APP_ROOT/.deploy-state/releases/$RELEASE_ID"
          "$APP_ROOT/venv/bin/python" "$STATE_RELEASE/deployment_state.py" mark-frontend \
            --state-root "$APP_ROOT/.deploy-state" --release-id "$RELEASE_ID"
          JOURNAL="$APP_ROOT/web-ui/.frontend-releases/$RELEASE_ID.json"
          printf '%s\n' "$JOURNAL" > "$REMOTE_RELEASE/frontend-journal.path"
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/frontend_release.py" promote \
            --archive "$REMOTE_RELEASE/frontend-dist.tar.gz" \
            --active "$APP_ROOT/web-ui/dist" \
            --release-id "$RELEASE_ID" \
            --source-sha "$DEPLOY_SHA"
          SCRIPT

      - name: Restart the managed service and verify readiness
        if: steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -euo pipefail
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          APP_ROOT="$HOME/PaperReviewAgent"
          REMOTE_RELEASE="/tmp/paperreview-deploy-$RELEASE_ID"
          sudo systemctl restart paperreview
          SERVICE_PID=$(sudo systemctl show paperreview -p MainPID --value)
          test "$SERVICE_PID" -gt 0
          test -r "/proc/$SERVICE_PID/cmdline"
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/check_deploy_ready.py" \
            --posts "$APP_ROOT/data/blog/posts.json" --service-pid "$SERVICE_PID" \
            --request-timeout 5 --attempts 30 --interval 2 --deadline 90 \
            --expected-revision "$DEPLOY_SHA" --expected-pid "$SERVICE_PID"
          JOURNAL=$(cat "$REMOTE_RELEASE/frontend-journal.path")
          "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/frontend_release.py" finalize \
            --active "$APP_ROOT/web-ui/dist" --journal "$JOURNAL"
          STATE_RELEASE="$APP_ROOT/.deploy-state/releases/$RELEASE_ID"
          "$APP_ROOT/venv/bin/python" "$STATE_RELEASE/deployment_state.py" clear \
            --state-root "$APP_ROOT/.deploy-state" --release-id "$RELEASE_ID"
          SCRIPT

      - name: Roll back frontend and backend on failure
        if: (failure() || cancelled()) && steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'bash -s' -- "$DEPLOY_SHA" "$RELEASE_ID" <<'SCRIPT'
          set -u
          APP_ROOT="$HOME/PaperReviewAgent"
          DEPLOY_SHA="$1"
          RELEASE_ID="$2"
          REMOTE_RELEASE="/tmp/paperreview-deploy-$RELEASE_ID"
          STATE_ROOT="$APP_ROOT/.deploy-state"
          STATE_RELEASE="$STATE_ROOT/releases/$RELEASE_ID"
          ROLLBACK_FAILED=0
          ATTESTATION_MODE=invalid

          if ! "$APP_ROOT/venv/bin/python" "$REMOTE_RELEASE/deployment_state.py" owns \
            --state-root "$STATE_ROOT" --release-id "$RELEASE_ID"; then
            exit 0
          fi
          READINESS_HELPER="$STATE_RELEASE/check_deploy_ready.py"
          STATE_HELPER="$STATE_RELEASE/deployment_state.py"

          if test -s "$STATE_RELEASE/backend.previous.health.json"; then
            ATTESTATION_MODE=$("$APP_ROOT/venv/bin/python" -c \
              'import json,sys; mode=json.load(open(sys.argv[1], encoding="utf-8"))["attestation_mode"]; assert mode in {"supported", "legacy"}; print(mode)' \
              "$STATE_RELEASE/backend.previous.health.json") || ROLLBACK_FAILED=1
          else
            ROLLBACK_FAILED=1
          fi

          if test -e "$STATE_RELEASE/frontend-promotion.intent"; then
            JOURNAL="$APP_ROOT/web-ui/.frontend-releases/$RELEASE_ID.json"
            if test -f "$JOURNAL"; then
              "$APP_ROOT/venv/bin/python" "$STATE_RELEASE/frontend_release.py" rollback \
                --active "$APP_ROOT/web-ui/dist" --journal "$JOURNAL" || ROLLBACK_FAILED=1
            else
              ROLLBACK_FAILED=1
            fi
          fi

          if test -s "$STATE_RELEASE/previous.sha"; then
            PREVIOUS_SHA=$(cat "$STATE_RELEASE/previous.sha")
            git -C "$APP_ROOT" checkout --detach --force "$PREVIOUS_SHA" || ROLLBACK_FAILED=1
            test "$(git -C "$APP_ROOT" rev-parse HEAD)" = "$PREVIOUS_SHA" || ROLLBACK_FAILED=1
            "$APP_ROOT/venv/bin/pip" install -r "$APP_ROOT/requirements.txt" --quiet || ROLLBACK_FAILED=1
            sudo systemctl restart paperreview || ROLLBACK_FAILED=1
            SERVICE_PID=$(sudo systemctl show paperreview -p MainPID --value)
            test "$SERVICE_PID" -gt 0 || ROLLBACK_FAILED=1
            test -r "/proc/$SERVICE_PID/cmdline" || ROLLBACK_FAILED=1
            if test "$ATTESTATION_MODE" = supported; then
              "$APP_ROOT/venv/bin/python" "$READINESS_HELPER" \
                --posts "$APP_ROOT/data/blog/posts.json" --service-pid "$SERVICE_PID" \
                --request-timeout 5 --attempts 30 --interval 2 --deadline 90 \
                --expected-revision "$PREVIOUS_SHA" --expected-pid "$SERVICE_PID" || ROLLBACK_FAILED=1
            elif test "$ATTESTATION_MODE" = legacy; then
              "$APP_ROOT/venv/bin/python" "$READINESS_HELPER" \
                --posts "$APP_ROOT/data/blog/posts.json" --service-pid "$SERVICE_PID" \
                --request-timeout 5 --attempts 30 --interval 2 --deadline 90 || ROLLBACK_FAILED=1
            else
              ROLLBACK_FAILED=1
            fi
          else
            ROLLBACK_FAILED=1
          fi
          if test "$ROLLBACK_FAILED" -eq 0; then
            "$APP_ROOT/venv/bin/python" "$STATE_HELPER" clear \
              --state-root "$STATE_ROOT" --release-id "$RELEASE_ID" || ROLLBACK_FAILED=1
          fi
          exit "$ROLLBACK_FAILED"
          SCRIPT

      - name: Cleanup successful release bundle
        if: success() && steps.stale.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "rm -r '/tmp/paperreview-deploy-$RELEASE_ID'" || true

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key /tmp/frontend-dist.tar.gz
