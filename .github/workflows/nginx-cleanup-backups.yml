name: nginx-cleanup-backups

# One-time, manually-triggered cleanup of the stray nginx config backups created
# during the HTTPS recovery. Removes ONLY paperreview.pre-recover.* (not the
# active config, not the older paperreview.bak.*). These files are not loaded by
# nginx (sites-enabled has a single symlink), so no reload is needed. Delete after.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Remove recovery backup files
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash -s' <<'SCRIPT'
          set -e
          DIR=/etc/nginx/sites-available
          echo "===== BEFORE ====="
          ls -la "$DIR"
          echo "===== removing $DIR/paperreview.pre-recover.* (recovery artifacts only) ====="
          # Guard: never touch the active config or the pre-existing .bak.
          sudo rm -f "$DIR"/paperreview.pre-recover.* && echo "removed recovery backups."
          echo "===== AFTER ====="
          ls -la "$DIR"
          echo "===== sanity: active config + symlink intact ====="
          test -f "$DIR/paperreview" && echo "active config present: OK"
          readlink -f /etc/nginx/sites-enabled/paperreview
          sudo nginx -t
          SCRIPT
