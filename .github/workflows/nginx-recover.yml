name: nginx-recover-https

# One-time, manually-triggered recovery for the HTTPS outage caused by an
# earlier deploy that overwrote the production TLS config with the HTTP-only
# reference config. Re-installs the EXISTING certbot cert into nginx (no
# reissue) and reloads ONLY if `nginx -t` passes. Safe to re-run; delete after.
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Diagnose and restore HTTPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash -s' <<'SCRIPT'
          set -e
          echo "===================== DIAGNOSTICS ====================="
          echo "--- certbot certificates ---"
          sudo certbot certificates 2>/dev/null || echo "(certbot unavailable / no certs)"
          echo "--- sites-available / sites-enabled ---"
          ls -la /etc/nginx/sites-available/ /etc/nginx/sites-enabled/ 2>/dev/null || true
          echo "--- effective 443 listeners BEFORE (expect 0 during outage) ---"
          sudo nginx -T 2>/dev/null | grep -c 'listen 443' || true
          # Resolve the ACTIVE config via the enabled symlink (backup files in
          # sites-available also contain 'location = /blog {' and must be ignored).
          TARGET="$(readlink -f /etc/nginx/sites-enabled/paperreview 2>/dev/null || true)"
          [ -z "$TARGET" ] && TARGET="$(grep -rl 'location = /blog {' /etc/nginx/sites-enabled/ 2>/dev/null | head -1 || true)"
          echo "TARGET config (active): $TARGET"
          [ -n "$TARGET" ] && sudo grep -nE 'listen|server_name|ssl_certificate' "$TARGET" || true

          echo "===================== BACKUP current config ====================="
          if [ -n "$TARGET" ]; then
            BK="${TARGET}.pre-recover.$(date +%s)"
            sudo cp "$TARGET" "$BK" && echo "Backed up current config -> $BK"
          fi

          echo "===================== RESTORE TLS (certbot install, no reissue) ====================="
          CERT="$(sudo certbot certificates 2>/dev/null | grep -oE 'Certificate Name: .*' | awk '{print $3}' | head -1 || true)"
          echo "Detected certificate name: '$CERT'"
          if [ -z "$CERT" ]; then
            echo "ERROR: no certbot certificate found; cannot auto-restore. No changes made." >&2
            exit 1
          fi
          sudo certbot install --nginx --cert-name "$CERT" --non-interactive || {
            echo "ERROR: certbot install failed; NOT reloading." >&2
            exit 1
          }

          echo "===================== DIAGNOSE homepage 500 ====================="
          echo "--- recent nginx error log ---"
          sudo tail -n 15 /var/log/nginx/error.log 2>/dev/null || true
          echo "--- root directive in target ---"
          sudo grep -nE '^[[:space:]]*root[[:space:]]' "$TARGET" || true

          echo "===================== FIX SPA root path if wrong ====================="
          # Reference config ships root=/home/ec2-user/... which may not match the
          # real deploy path; then try_files can't find index.html -> 500 at '/'.
          REAL_DIST="$(ls -d /home/*/PaperReviewAgent/web-ui/dist 2>/dev/null | head -1 || true)"
          CONF_ROOT="$(sudo grep -oE '^[[:space:]]*root[[:space:]]+[^;]+' "$TARGET" | head -1 | awk '{print $2}')"
          echo "conf root='$CONF_ROOT' | real dist='$REAL_DIST'"
          if [ -n "$CONF_ROOT" ] && [ -f "$CONF_ROOT/index.html" ]; then
            echo "index.html present at conf root."
          else
            echo "index.html MISSING at conf root -> this is the 500 cause."
          fi
          if [ -n "$REAL_DIST" ] && [ -f "$REAL_DIST/index.html" ] && [ "$CONF_ROOT" != "$REAL_DIST" ]; then
            sudo sed -i "s#root ${CONF_ROOT};#root ${REAL_DIST};#" "$TARGET"
            echo "Patched SPA root: $CONF_ROOT -> $REAL_DIST"
          else
            echo "SPA root not patched (already correct or real dist not found)."
          fi

          echo "===================== VALIDATE + RELOAD (guarded) ====================="
          if sudo nginx -t; then
            sudo systemctl reload nginx
            echo "nginx reloaded successfully."
          else
            echo "ERROR: nginx -t failed after certbot; NOT reloading (site unchanged)." >&2
            exit 1
          fi

          echo "===================== VERIFY from host ====================="
          echo "443 listeners AFTER: $(sudo nginx -T 2>/dev/null | grep -c 'listen 443')"
          curl -skI https://jiphyeonjeon.kr/ | head -1 || true
          echo "category SSR: $(curl -sk https://jiphyeonjeon.kr/blog/category/engineering | grep -c CollectionPage) CollectionPage"
          SCRIPT
