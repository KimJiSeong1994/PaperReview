name: Daily Recommendations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-recommendations-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
      DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      RELEASE_PATH: ${{ vars.RECOMMENDATIONS_RELEASE_PATH }}
      RELEASE_SHA: ${{ vars.RECOMMENDATIONS_RELEASE_SHA }}
      DATA_ROOT: ${{ vars.RECOMMENDATIONS_DATA_ROOT }}
      PUBLIC_SOURCE_QUALIFIED: ${{ vars.RECOMMENDATIONS_PUBLIC_SOURCE_QUALIFIED }}
    steps:
      - name: Immutable common recommendation batch (external source disabled)
        shell: python
        run: |
          import json
          import os
          import re
          import signal
          import subprocess
          import tempfile
          from pathlib import Path

          def interrupted(signum, frame):
              print(json.dumps({"stage": "batch", "code": "interrupted"}), flush=True)
              raise SystemExit(2)
          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          def fail(code):
              print(json.dumps({"stage": "batch", "code": code}))
              raise SystemExit(2)
          config = {name: os.environ.get(name, "") for name in (
              "RELEASE_PATH", "RELEASE_SHA", "DATA_ROOT", "PUBLIC_SOURCE_QUALIFIED")}
          if not re.fullmatch(r"[0-9a-f]{40}", config["RELEASE_SHA"]):
              fail("release_unconfigured")
          if not all(config[name].startswith("/") for name in ("RELEASE_PATH", "DATA_ROOT")):
              fail("paths_unconfigured")
          host, user = os.environ["DEPLOY_HOST"], os.environ["DEPLOY_USER"]
          if not re.fullmatch(r"[A-Za-z0-9.-]+", host) or not re.fullmatch(r"[A-Za-z0-9_-]+", user):
              fail("transport_unconfigured")
          if not os.environ["DEPLOY_KEY"] or not os.environ["DEPLOY_KNOWN_HOSTS"]:
              fail("transport_unconfigured")
          remote = "CONFIG = " + repr(config) + "\n" + r'''
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path
          def finish(code):
              print(json.dumps({"stage": "batch", "code": code}), flush=True)
              raise SystemExit(2)
          release = Path(CONFIG["RELEASE_PATH"])
          data = Path(CONFIG["DATA_ROOT"])
          if not release.is_dir() or release.is_symlink() or not data.is_dir():
              finish("release_missing")
          def git(*args):
              result = subprocess.run(["git", "-C", str(release), *args], capture_output=True, timeout=10)
              if result.returncode:
                  finish("release_check_failed")
              return result.stdout.decode().strip()
          if git("rev-parse", "HEAD") != CONFIG["RELEASE_SHA"] or git("status", "--porcelain", "--untracked-files=all"):
              finish("release_drift")
          python = release / "venv/bin/python"
          if not python.is_file():
              finish("runtime_missing")
          run_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
          common = ["--candidate-root", str(data / "recommendation-candidates"),
                    "--run-at", run_at]
          collector = [str(python), "scripts/collect_related_papers_for_wiki.py", *common,
                       "--final-root", str(data / "recommendations")]
          if CONFIG["PUBLIC_SOURCE_QUALIFIED"] == "true":
              collector.append("--source-qualified")
          daily = [str(python), "scripts/generate_daily_recommendations.py", *common,
                   "--users-db", str(data / "users.db"), "--events-db", str(data / "events.db"),
                   "--bookmarks-db", str(data / "bookmarks.db"),
                   "--artifacts-dir", str(data / "recommendations"), "--limit", "12"]
          child_env = {**os.environ, "DATA_DIR": str(data),
                       "EVENTS_DB_PATH": str(data / "events.db"),
                       "FEATURE_FLAGS_DB_PATH": str(data / "feature_flags.db")}
          # Both commands are locally owned children of the remote timeout process group.
          # Daily CLI owns its authoritative single-batch lease. No opaque producer is run.
          for stage, command in (("public_collector", collector), ("common_daily", daily)):
              result = subprocess.run(command, cwd=release, env=child_env,
                                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              code = "ok" if result.returncode == 0 else "failed"
              if stage == "public_collector" and result.returncode == 3:
                  code = "acquisition_error"
              print(json.dumps({"stage": stage, "code": code}), flush=True)
              allowed = (0, 3) if stage == "public_collector" else (0,)
              if result.returncode not in allowed:
                  raise SystemExit(2)
          print(json.dumps({"stage": "external", "code": "source_disabled"}), flush=True)
          '''
          # A unique credential directory is removed on success, failure, timeout or interrupt.
          # No historical remote credentials are touched. Pinned host keys are mandatory.
          try:
              with tempfile.TemporaryDirectory(prefix="recommendations-transport-") as temporary:
                  key = Path(temporary) / "key"
                  known = Path(temporary) / "known_hosts"
                  key.write_text(os.environ.pop("DEPLOY_KEY"))
                  known.write_text(os.environ.pop("DEPLOY_KNOWN_HOSTS"))
                  key.chmod(0o600)
                  known.chmod(0o600)
                  command = ["ssh", "-i", str(key), "-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=yes",
                             "-o", "UserKnownHostsFile=" + str(known), "-o", "ConnectTimeout=15",
                             "-o", "ServerAliveInterval=15", "-o", "ServerAliveCountMax=2",
                             user + "@" + host,
                             "timeout --signal=TERM --kill-after=5s 780s python3 -"]
                  result = subprocess.run(command, input=remote, text=True, stdout=subprocess.DEVNULL,
                                          stderr=subprocess.DEVNULL, timeout=810)
                  if result.returncode:
                      fail("remote_batch_failed")
          except subprocess.TimeoutExpired:
              fail("transport_timeout")
          except Exception:
              fail("transport_failed")
          print(json.dumps({"stage": "batch", "code": "complete", "external": "disabled"}))
